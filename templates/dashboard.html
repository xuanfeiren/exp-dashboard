<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>experiment dashboard</title>
<style>
/* ---------- tokens: light/dark automatic ---------- */
.viz-root{color-scheme:light;--page:#f7f7f5;--surface:#fcfcfb;--surface-2:#f0efec;--ink:#0b0b0b;--ink-2:#4f4e4a;--muted:#8a8880;--grid:#e2e1db;
  --border:rgba(11,11,11,.10);--good:#0f9d58;--warn:#c98a00;--bad:#d93f3f;--run:#2a78d6;--silent:#c2187a;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;--page:#0e0e0d;--surface:#191918;--surface-2:#23231f;
  --ink:#f4f4f1;--ink-2:#bdbcb3;--muted:#85837b;--grid:#2e2e2a;--border:rgba(255,255,255,.10);--good:#3cb371;--warn:#e0a020;--bad:#e05b5b}}
*{box-sizing:border-box}
body{margin:0;font:13.5px/1.5 -apple-system,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;background:var(--page);color:var(--ink)}
.wrap{max-width:1480px;margin:0 auto;padding:16px 22px 48px}
h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em} h2{font-size:14px;font-weight:650;margin:0 0 8px} h3{font-size:13px;font-weight:650;margin:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.badge.fresh{border-color:var(--good);color:var(--good)} .badge.stale{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:650}
.banner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:14px 0 10px}
.banner .now{font-size:13.5px} .banner .now b{font-weight:650}
.strip{display:flex;gap:3px;margin-top:8px;height:14px} .strip .seg{position:relative;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:24px;cursor:pointer}
.strip .seg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--good);opacity:.85} .strip .seg.running .fill{background:var(--run)}
.strip .seg.running{outline:2px solid var(--run);outline-offset:1px} .strip .seg .lbl{position:absolute;inset:0;font-size:9.5px;line-height:14px;text-align:center;color:var(--ink);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.strip .seg.done .lbl{color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--grid);margin:8px 0 14px;flex-wrap:wrap}
.tab{padding:8px 14px 9px;font-size:13px;color:var(--ink-2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)} .tab.on{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.tab .n{font-size:10.5px;background:var(--surface-2);border-radius:999px;padding:0 6px;color:var(--ink-2)}
section{display:none} section.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px} .tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.2;margin-top:2px} .tile .v.small{font-size:15px;margin-top:6px} .tile .h{font-size:11px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0}
.card.clickable{cursor:pointer} .card.clickable:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:10px} .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.explain{color:var(--ink-2);font-size:12px;line-height:1.55;margin-top:6px;border-top:1px solid var(--grid);padding-top:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px} th,td{text-align:left;padding:5px 8px;border-top:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-top:none;cursor:pointer;user-select:none} th.sorted{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
.est{font-style:italic;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;border:1px solid var(--border);line-height:1.5;white-space:nowrap}
.chip.done,.chip.pass,.chip.supported{background:#0f9d5822;color:var(--good)} .chip.running{background:#2a78d622;color:var(--run)} .chip.queued,.chip.pending{color:var(--muted)}
.chip.failed,.chip.killed,.chip.fail,.chip.refuted{background:#d93f3f22;color:var(--bad)} .chip.silent{background:#c2187a22;color:var(--silent);font-weight:650}
.chip.warn,.chip.inconclusive{background:#fab21933;color:var(--warn)}
.seed{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:650;margin:2px;border:1px solid var(--border);color:var(--muted);background:var(--surface-2);cursor:pointer}
.seed.running{background:var(--run);color:#fff;border-color:var(--run);animation:pulse 1.8s infinite} .seed.done{background:#0f9d5822;color:var(--good);border-color:#0f9d5855}
.seed.failed,.seed.killed{background:var(--bad);color:#fff} .seed.silent{background:var(--silent);color:#fff;border-color:var(--silent)}
@keyframes pulse{50%{opacity:.55}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 4px} .legend .item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.legend .item.off{opacity:.35;text-decoration:line-through} .legend .key{width:14px;height:3px;border-radius:2px}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:12px} .plot{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px 8px}
.plot h3{cursor:pointer} .plot h3:hover{color:var(--accent)} .plot .csub{font-size:11.5px;color:var(--muted);margin:1px 0 4px}
.panels{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .panel h4{font-size:11.5px;font-weight:650;margin:0 0 2px;color:var(--ink-2)}
svg text{fill:var(--ink-2);font-size:10.5px} svg .axis{stroke:var(--grid)}
.controls{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap;margin-bottom:8px}
.controls label{display:flex;gap:5px;align-items:center} .controls select,.controls input[type=text]{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
.tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 2px 12px rgba(0,0,0,.18);display:none;z-index:30;max-width:380px}
.tooltip .row{display:flex;align-items:center;gap:6px;margin-top:2px} .tooltip .key{width:12px;height:3px;border-radius:2px;flex:none} .tooltip .v{font-weight:650;font-variant-numeric:tabular-nums} .tooltip .k{color:var(--ink-2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.modal.on{display:flex} .modal .box{background:var(--surface);border-radius:14px;padding:18px 22px;max-width:1200px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);position:relative}
.modal .x{position:absolute;right:14px;top:10px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.md h3{font-size:15px;margin:10px 0 4px} .md h4{font-size:13.5px;margin:8px 0 2px} .md p{margin:4px 0 8px;color:var(--ink-2)} .md ul{margin:2px 0 8px 18px;color:var(--ink-2)} .md code{font:11.5px ui-monospace,Menlo,monospace;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.md b{color:var(--ink)}
.coremap{display:grid;grid-template-columns:repeat(16,1fr);gap:3px} .cell{height:24px;border-radius:5px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid var(--border);overflow:hidden}
.gpus{display:flex;gap:4px;flex-wrap:wrap} .gpu{width:56px;height:40px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--border)}
.gpu .fill{position:absolute;left:0;right:0;bottom:0;background:var(--run)} .gpu span{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-2)}
pre.log{margin:0;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:var(--ink-2);max-height:420px;overflow:auto}
.inc{padding:6px 10px;border-left:3px solid var(--warn);background:var(--surface-2);border-radius:6px;margin:4px 0;font-size:12.5px} .inc.error{border-left-color:var(--bad)} .inc time{color:var(--muted);font-size:11px;margin-right:8px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.phasecard .body{display:none;margin-top:8px} .phasecard.open .body{display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:2px 10px;font-size:12.5px} .kv .k{color:var(--muted)}
.best{color:var(--good);font-weight:650} .second{color:#6cbf8a;font-weight:600}
.small{font-size:11.5px;color:var(--muted)} .prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px} .prog i{display:block;height:100%;background:var(--run)}
footer{color:var(--muted);font-size:11px;margin-top:20px}
a{color:var(--accent)}
</style>
</head>
<body class="viz-root"><div class="wrap">
<div class="head"><div><h1 id="title">…</h1><div class="sub" id="subtitle"></div></div><div class="badge" id="upd">connecting…</div></div>

</div>

<div class="modal" id="modal"><div class="box"><button class="x" id="mx">×</button><div id="mbody"></div></div></div>
<script>
// ================================ CONFIG (normally the only thing to edit) ================================
const LIVE_URL = "live.json";   // served next to this file
const REFRESH_MS = 25000;
// ==========================================================================================================
const L = {
 en: { tabs: { overview: "Overview", plan: "Plan", progress: "Progress", results: "Results", explore: "Explore", ops: "Ops" },
       t_done: "arms done", t_run: "running", t_queued: "queued", t_bad: "failed / silent", t_phase: "current phase", t_eta: "ETA (all phases)", t_evals: "records", t_cost: "cost",
       done: "done", running: "running", queued: "queued", failed: "failed", silent: "silent", killed: "killed", pass: "pass", fail: "fail", pending: "pending", warn: "warn",
       supported: "supported", refuted: "refuted", inconclusive: "inconclusive", left: "remaining", ago: "ago", updated: "collector heartbeat", stale: "STALE", snapshot: "snapshot",
       phase: "phase", start: "start", end: "end", dur: "duration", status: "status", arms: "arms", est_note: "italic = estimate (queue simulated over concurrency slots; manual phases use their planned duration); upright = observed",
       hypotheses: "Hypotheses", gates: "Pre-registered gates", design: "Design", factors_note: "arms = product of factor levels", phases: "Phases", measures: "What is measured", links: "Links",
       metric: "metric", xaxis: "x-axis", scalar: "per-arm scalar", purpose: "purpose", method: "method", criteria: "criteria", outputs: "outputs", depends: "after", planned: "planned",
       gantt: "Timeline", matrix: "Arm matrix", rows: "rows", cols: "columns", armtable: "All arms", filter: "show", all: "all", where: "Where we are",
       headline: "Headline plots", recent: "Recent log", incidents: "Incidents", none: "(none)", waiting: "waiting for data…",
       type: "chart", y: "y", x: "x", group: "group by", facet: "facet by", agg: "aggregate", logy: "log y", logx: "log x", explore_note: "Every metric, x-axis and per-arm scalar declared in the plan can be combined here. The URL hash holds the current view — copy it to share.",
       resources: "Resources", anchors: "Anchors (session drift)", log: "Log", collector: "Collector", silent_arms: "Silent arms", disk: "disk free", load: "load", core: "core",
       provisional: "* provisional: best-so-far of an unfinished arm", n: "n", never: "never", catch: "reached at", detail: "Arm detail", records: "last records", src: "source", enlarge: "click title to enlarge",
       median_iqr: "median ± IQR", mean_sd: "mean ± sd", lanes: "individual arms", median: "median", mean: "mean", value: "value", ref: "baseline" },
 zh: { tabs: { overview: "总览", plan: "计划", progress: "进度", results: "结果", explore: "探索", ops: "运行" },
       t_done: "臂 完成", t_run: "运行中", t_queued: "排队", t_bad: "失败 / 静默", t_phase: "当前阶段", t_eta: "预计全部完成", t_evals: "记录数", t_cost: "累计成本",
       done: "已完成", running: "运行中", queued: "排队", failed: "失败", silent: "静默", killed: "已杀", pass: "通过", fail: "未过", pending: "待定", warn: "警告",
       supported: "支持", refuted: "否定", inconclusive: "不确定", left: "剩余", ago: "前", updated: "collector 心跳", stale: "数据过期", snapshot: "静态快照",
       phase: "阶段", start: "开始", end: "结束", dur: "时长", status: "状态", arms: "臂", est_note: "斜体 = 预估（按并发槽位模拟排队；手动阶段用计划时长）；正体 = 已观测",
       hypotheses: "假设", gates: "预注册判据", design: "设计", factors_note: "臂 = 各因子水平的笛卡尔积", phases: "阶段", measures: "测什么", links: "链接",
       metric: "指标", xaxis: "横轴", scalar: "每臂标量", purpose: "目的", method: "做法", criteria: "判据", outputs: "产出", depends: "前置", planned: "计划",
       gantt: "时间线", matrix: "臂矩阵", rows: "行", cols: "列", armtable: "全部臂", filter: "只看", all: "全部", where: "现在做到哪了",
       headline: "重点图", recent: "最近日志", incidents: "事件 / 事故", none: "（无）", waiting: "等待数据…",
       type: "图型", y: "纵轴", x: "横轴", group: "分组", facet: "分面", agg: "聚合", logy: "log y", logx: "log x", explore_note: "计划里声明的任何指标、横轴、每臂标量都能在这里任意组合。当前视图写在 URL hash 里，复制即可分享。",
       resources: "资源", anchors: "Anchors（会话漂移）", log: "日志", collector: "Collector", silent_arms: "静默臂", disk: "磁盘剩余", load: "负载", core: "核",
       provisional: "* 临时值：未完成臂的 best-so-far", n: "n", never: "never", catch: "追平于", detail: "臂详情", records: "最近记录", src: "数据源", enlarge: "点标题放大",
       median_iqr: "中位 ± IQR", mean_sd: "均值 ± sd", lanes: "每臂单独", median: "中位", mean: "均值", value: "值", ref: "baseline" } };
const PALETTE = ["#2a78d6", "#eb6834", "#1baf7a", "#8e5ad6", "#c2187a", "#c9a200", "#0aa5b8", "#7a7a72", "#e07b00", "#4c9e4c"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let D = null, C = null, T = L.en, TAB = "overview", HIDDEN = {}, SORT = { key: "id", dir: 1 }, FILTER = "all", MATRIX = {}, EXPL = null, OPEN_PHASES = new Set();

// ---------------------------------------------------------------- formatting & stats
function fmtNum(v, unit) {
  if (v == null || v === Infinity || Number.isNaN(v)) return v === Infinity ? "∞" : "—";
  if (unit === "µs" || unit === "us") return v >= 1e6 ? (v / 1e6).toFixed(2) + " s" : v >= 1000 ? (v / 1000).toFixed(2) + " ms" : v.toFixed(v < 10 ? 2 : 1) + " µs";
  const a = Math.abs(v); let s = a >= 1e6 ? v.toExponential(2) : a >= 1000 ? Math.round(v).toLocaleString() : a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : a === 0 ? "0" : v.toPrecision(3);
  if (unit === "$") return "$" + s; if (unit === "%") return s + "%"; return s + (unit ? " " + unit : "");
}
const pad2 = n => String(n).padStart(2, "0");
function fmtT(ts) { if (!ts) return "—"; const t = new Date(ts * 1000), n = new Date(); const same = t.toDateString() === n.toDateString();
  return (same ? "" : (t.getMonth() + 1) + "/" + t.getDate() + " ") + pad2(t.getHours()) + ":" + pad2(t.getMinutes()); }
function fmtDur(s) { if (s == null || !isFinite(s)) return "—"; s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? d + "d" + h + "h" : h ? h + "h" + pad2(m) + "m" : m ? m + "m" : s + "s"; }
const fin = xs => xs.filter(x => x != null && Number.isFinite(x));
function median(xs) { const v = fin(xs).sort((a, b) => a - b); if (!v.length) return null; const h = v.length >> 1; return v.length % 2 ? v[h] : (v[h - 1] + v[h]) / 2; }
function quant(xs, q) { const v = fin(xs).sort((a, b) => a - b); if (!v.length) return null; const i = (v.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return v[lo] + (v[hi] - v[lo]) * (i - lo); }
function mean(xs) { const v = fin(xs); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function sd(xs) { const v = fin(xs); if (v.length < 2) return null; const m = mean(v); return Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (v.length - 1)); }
const chip = (txt, cls) => `<span class="chip ${cls}">${esc(txt)}</span>`;
const stChip = st => chip(T[st] || st, st);
function stepAt(curve, x) { let v = null; for (const p of curve) { if (p[0] <= x) v = p[1]; else break; } return v; }
function md(text) {  // tiny markdown: #/## headings, - bullets, **b**, *i*, `code`, [t](u), paragraphs
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\((https?:[^)]+|#[^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');
  let out = "", inList = false, para = [];
  const flush = () => { if (para.length) { out += `<p>${inl(para.join(" "))}</p>`; para = []; } if (inList) { out += "</ul>"; inList = false; } };
  for (const raw of String(text || "").split("\n")) { const line = raw.trimEnd();
    if (/^##\s/.test(line)) { flush(); out += `<h4>${inl(line.slice(3))}</h4>`; }
    else if (/^#\s/.test(line)) { flush(); out += `<h3>${inl(line.slice(2))}</h3>`; }
    else if (/^[-*]\s/.test(line)) { if (para.length) { out += `<p>${inl(para.join(" "))}</p>`; para = []; } if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inl(line.slice(2))}</li>`; }
    else if (!line.trim()) flush(); else { if (inList) { out += "</ul>"; inList = false; } para.push(line); } }
  flush(); return `<div class="md">${out}</div>`;
}

// ---------------------------------------------------------------- data preparation
function prep(d) {
  const now = Date.now() / 1000, P = d.plan || {}, factors = P.factors || [], arms = d.arms || [];
  const F = Object.fromEntries(factors.map(f => [f.id, f]));
  const levelIdx = Object.fromEntries(factors.map(f => [f.id, Object.fromEntries(f.levels.map((l, i) => [l.id, i]))]));
  const color = (fid, lid) => { const f = F[fid]; if (!f) return PALETTE[0]; const lv = f.levels.find(l => l.id === String(lid)); return (lv && lv.color) || PALETTE[(levelIdx[fid][String(lid)] ?? 0) % PALETTE.length]; };
  const label = (fid, lid) => { const f = F[fid]; const lv = f && f.levels.find(l => l.id === String(lid)); return lv ? (lv.label || lv.id) : String(lid); };
  const metrics = P.metrics || [], xaxes = P.x_axes || [], scalars = P.scalars || [];
  const M = Object.fromEntries(metrics.map(m => [m.id, m])), X = Object.fromEntries(xaxes.map(x => [x.id, x])), S = Object.fromEntries(scalars.map(s => [s.id, s]));
  const base = P.baseline || null;
  const replicate = new Set(factors.filter(f => f.replicate || /^(seed|rep|replicate|run|trial)$/i.test(f.id)).map(f => f.id));
  const cellKey = (a, skip) => factors.filter(f => f.id !== skip && !replicate.has(f.id)).map(f => a.factors[f.id]).join("|");
