<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>experiment hub</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;font:13px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;display:flex;height:100vh;background:#f4f3ee;color:#242e2b}
@media (prefers-color-scheme:dark){body{background:#0d0d0d;color:#fff}aside{background:#1a1a19!important;border-color:rgba(255,255,255,.1)!important}aside button{color:#c3c2b7!important}aside .title{color:#fff!important}}
aside{width:220px;flex:none;background:#253a33;color:#e4eee6;border-right:1px solid rgba(11,11,11,.1);padding:24px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
aside .title{font-size:14px;font-weight:700;margin:2px 8px 10px}
aside button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:12.5px;font-weight:600;padding:8px 10px;border:none;border-radius:8px;background:transparent;color:#c1d3c8;cursor:pointer}
aside button:hover{background:rgba(42,120,214,.08)} aside button.on{background:#dce8d5;color:#233c32}
aside .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:none} .dot.fresh{background:#0ca30c} .dot.stale{background:#e34948} .dot.done{background:#2a78d6}
aside .meta{font-size:10.5px;font-weight:400;opacity:.75;margin-left:auto;white-space:nowrap}
aside .foot{margin-top:auto;font-size:10.5px;color:#b0c6b9;padding:8px}
main{flex:1;display:flex;min-width:0}button:focus-visible{outline:2px solid #c5dfb0;outline-offset:2px}@media(max-width:700px){body{flex-direction:column}aside{width:100%;max-height:200px;padding:12px}aside .foot{display:none}#list{display:flex;overflow-x:auto;gap:6px}aside button{width:auto;min-width:140px}main{min-height:0}} iframe{border:none;width:100%;height:100%}
</style>
</head>
<body>
<aside><div class="title">Experiments</div><div id="list"></div><div class="foot">green = collector heartbeat fresh · red = stale · blue = campaign finished</div></aside>
<main><iframe id="frame" title="Selected experiment"></iframe></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id); let CAMPS = [];
function pick(c) { if (!c) return; document.querySelectorAll("aside button").forEach(b => b.classList.toggle("on", b.dataset.name === c.name));
  const target = new URL(c.path.replace(/\/?$/, "/") + "index.html?v=" + Date.now(),location.href); if (target.origin !== location.origin) return; $("frame").src = target.href; location.hash = c.name; }
async function load() {
  CAMPS = await (await fetch("campaigns.json?t=" + Date.now())).json();
  if (!CAMPS.length) {$("list").textContent="No campaigns registered.";return;}
  $("list").innerHTML = CAMPS.map(c => `<button data-name="${esc(c.name)}"><span class="dot" id="dot-${esc(c.name)}"></span><span>${esc(c.title || c.name)}</span><span class="meta" id="meta-${esc(c.name)}"></span></button>`).join("");
  document.querySelectorAll("aside button").forEach(b => b.onclick = () => pick(CAMPS.find(c => c.name === b.dataset.name)));
  const want = location.hash.slice(1); pick(CAMPS.find(c => c.name === want) || CAMPS[0]); beat();
}
async function beat() {  // sidebar dots: read each campaign's live.json heartbeat
  for (const c of CAMPS) { try { const d = await (await fetch(c.path.replace(/\/?$/, "/") + "live.json?t=" + Date.now())).json();
      const age = Date.now() / 1000 - d.updated, arms = d.arms || [], done = arms.length && arms.every(a => ["done", "failed", "killed"].includes(a.status));
      $("dot-" + c.name).className = "dot " + (done ? "done" : age > 3 * (d.collector_interval_s || 30) + 15 ? "stale" : "fresh");
      $("meta-" + c.name).textContent = done ? "done" : `${arms.filter(a => a.status === "running").length} run · ${Math.round(age)}s`; }
    catch (e) { $("dot-" + c.name).className = "dot"; } }
  setTimeout(beat, 30000);
}
load().catch(() => { $("list").textContent="Unable to load campaigns. Check campaigns.json."; });
</script>
</body>
</html>
