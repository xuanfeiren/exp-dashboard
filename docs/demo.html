<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>experiment dashboard</title>
<style>
/* ---------- tokens: light/dark automatic ---------- */
.viz-root{color-scheme:light;--page:#f4f3ee;--surface:#fffefa;--surface-2:#eaeae2;--ink:#242e2b;--ink-2:#56625d;--muted:#69756d;--grid:#dfe3da;
  --border:rgba(11,11,11,.10);--good:#0f9d58;--warn:#b7791f;--bad:#d93f3f;--run:#267a9b;--silent:#a83e74;--accent:#237968}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;--page:#0e0e0d;--surface:#191918;--surface-2:#23231f;
  --ink:#f4f4f1;--ink-2:#bdbcb3;--muted:#a5afa5;--grid:#2e2e2a;--border:rgba(255,255,255,.10);--good:#3cb371;--warn:#e0a020;--bad:#f18484;--run:#80bad9;--silent:#ec90bc;--accent:#8ecab2}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
.wrap{max-width:1680px;margin:0 auto;padding:28px 36px 48px 220px}
h1{font-size:28px;line-height:1.18;font-weight:650;margin:5px 0 8px;letter-spacing:-.035em;overflow-wrap:anywhere} h2{font-size:15px;font-weight:650;margin:0 0 8px} h3{font-size:14px;font-weight:650;margin:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.badge.fresh{border-color:var(--good);color:var(--good)} .badge.stale{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:650}
.banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:4px;padding:12px 16px;margin:22px 0 20px}
.banner .now{font-size:13.5px} .banner .now b{font-weight:650} .banner .age{color:var(--muted);font-size:11.5px;margin-left:8px} .banner .age.old{color:var(--warn)}
.strip{display:flex;gap:4px;margin-top:10px;min-height:22px;flex-wrap:wrap}.strip:empty{display:none}
.strip .seg{position:relative;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:70px;min-height:22px;cursor:pointer;border:1px solid var(--border)}
.strip .seg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--good);opacity:.8} .strip .seg.running .fill{background:var(--run);opacity:.3}
.strip .seg.running{border-color:var(--run)} .strip .seg.overdue{border-color:var(--warn)}
.strip .seg .lbl{position:absolute;inset:0;font-size:11px;line-height:20px;text-align:center;color:var(--ink);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.strip .seg.done .lbl{color:#fff;font-weight:600}
/* Navigation is quiet and separate from the evidence canvas. */
.rail{position:fixed;inset:0 auto 0 0;width:180px;background:#253a33;color:#e4eee6;padding:26px 16px;display:flex;flex-direction:column;z-index:10}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.03em;font-weight:650}.brand-mark{border:1px solid #799c8d;width:27px;height:27px;display:grid;place-items:center;color:#c5dfb0;border-radius:6px;font-family:Georgia,serif;font-size:20px}
.rail-caption{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#abc2b7;margin:34px 10px 10px}
.tabs{display:flex;flex-direction:column;gap:5px}
.tab{padding:11px 10px;font-size:13px;color:#c1d3c8;background:none;border:1px solid transparent;border-radius:5px;cursor:pointer;font-family:inherit;display:flex;gap:9px;align-items:center;text-align:left}
.tab:hover{color:#fff;background:#ffffff0c}.tab.on{background:#dce8d5;color:#233c32;font-weight:650}
.tab-index{font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}.tab .n{margin-left:auto;font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.75}
.rail-foot{margin-top:auto;color:#acc4b7;font-size:11px;padding:12px 10px;border-top:1px solid #ffffff20}
section{display:none} section.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);margin:0 0 24px}
.tile{padding:14px 18px;position:relative;border-right:1px solid var(--grid)}.tile:first-child{padding-left:0}.tile:last-child{border-right:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.tile .v{font-size:27px;line-height:1.3;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:4px}.tile .v.small{font-size:23px}.tile .h{font-size:11px;color:var(--ink-2);margin-top:3px}
.tile svg.spark{position:absolute;right:12px;top:20px;width:55px;height:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin:10px 0}
.card.clickable{cursor:pointer} .card.clickable:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:10px} .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.explain{color:var(--ink-2);font-size:12px;line-height:1.55;margin-top:6px;border-top:1px solid var(--grid);padding-top:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-top:none;user-select:none} th.sortable{cursor:pointer} th.sorted{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
.est{font-style:italic;color:var(--muted)} .overdue{color:var(--warn);font-weight:650}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;border:1px solid var(--border);line-height:1.5;white-space:nowrap}
.chip.done,.chip.pass,.chip.supported{background:#0f9d5822;color:var(--good)} .chip.running{background:#2a78d622;color:var(--run)} .chip.queued,.chip.pending{color:var(--muted)}
.chip.failed,.chip.killed,.chip.fail,.chip.refuted{background:#d93f3f22;color:var(--bad)} .chip.silent{background:#c2187a22;color:var(--silent);font-weight:650}
.chip.warn,.chip.inconclusive,.chip.auto{background:#b7791f22;color:var(--warn)} .chip.auto{border-style:dashed}
.seed{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:650;margin:2px;border:1px solid var(--border);color:var(--muted);background:var(--surface-2);cursor:pointer}
.seed.running{background:var(--run);color:#fff;border-color:var(--run);animation:pulse 1.8s infinite} .seed.done{background:#0f9d5822;color:var(--good);border-color:#0f9d5855}
.seed.done.auto{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
.seed.failed,.seed.killed{background:var(--bad);color:#fff} .seed.silent{background:var(--silent);color:#fff;border-color:var(--silent)}
@keyframes pulse{50%{opacity:.55}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 4px} .legend .item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.legend .item.off{opacity:.35;text-decoration:line-through} .legend .key{width:14px;height:3px;border-radius:2px}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:12px} .plot{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px 22px 14px}
.plot h3{cursor:pointer;line-height:1.35;overflow-wrap:anywhere} .plot h3:hover{color:var(--accent)} .plot .csub{font-size:11.5px;color:var(--muted);margin:1px 0 4px}
.panels{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))} .panel h4{font-size:12px;font-weight:650;margin:0 0 2px;color:var(--ink-2)}
.panel svg{display:block;margin:0 auto} .panel .note{font-size:10.5px;color:var(--muted)}
svg text{fill:var(--ink-2);font-size:11.5px} svg .axis{stroke:var(--grid)}
.controls{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap;margin-bottom:8px}
.controls label{display:flex;gap:5px;align-items:center} .controls select,.controls input[type=text]{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
.tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 2px 12px rgba(0,0,0,.18);display:none;z-index:30;max-width:min(280px,calc(100vw - 16px))}
.tooltip .row{display:flex;align-items:center;gap:6px;margin-top:2px} .tooltip .key{width:12px;height:3px;border-radius:2px;flex:none} .tooltip .v{font-weight:650;font-variant-numeric:tabular-nums} .tooltip .k{color:var(--ink-2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.modal.on{display:flex} .modal .box{background:var(--surface);border-radius:14px;padding:18px 22px;max-width:1200px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);position:relative}
.modal .x{position:absolute;right:14px;top:10px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.md h3{font-size:15px;margin:10px 0 4px} .md h4{font-size:13.5px;margin:8px 0 2px} .md p{margin:4px 0 8px;color:var(--ink-2)} .md ul{margin:2px 0 8px 18px;color:var(--ink-2)}
.md code{font:11.5px ui-monospace,Menlo,monospace;background:var(--surface-2);padding:1px 4px;border-radius:4px} .md b{color:var(--ink)}
.coremap{display:grid;grid-template-columns:repeat(16,1fr);gap:3px} .cell{height:24px;border-radius:5px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid var(--border);overflow:hidden}
.gpus{display:flex;gap:4px;flex-wrap:wrap} .gpu{width:56px;height:40px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--border)}
.gpu .fill{position:absolute;left:0;right:0;bottom:0;background:var(--run)} .gpu span{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-2)}
pre.log{margin:0;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:var(--ink-2);max-height:420px;overflow:auto}
pre.log .auto{color:var(--muted)}
.inc{padding:6px 10px;border-left:3px solid var(--warn);background:var(--surface-2);border-radius:6px;margin:4px 0;font-size:12.5px} .inc.error{border-left-color:var(--bad)} .inc time{color:var(--muted);font-size:11px;margin-right:8px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.phasecard .body{display:none;margin-top:8px} .phasecard.open .body{display:block} .phasecard .peek{color:var(--ink-2);font-size:12.5px;margin-top:4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:2px 10px;font-size:12.5px} .kv .k{color:var(--muted)}
.best{color:var(--good);font-weight:650} .second{color:#6cbf8a;font-weight:600}
.small{font-size:11.5px;color:var(--muted)} .prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px} .prog i{display:block;height:100%;background:var(--run)}
.warnbox{background:#b7791f18;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:8px 0}
footer{color:var(--muted);font-size:11px;margin-top:20px}
a{color:var(--accent)}

.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
.head>div:first-child{flex:1;min-width:200px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:100%}.badge{white-space:normal;font-size:11px;border-radius:4px;overflow-wrap:anywhere;max-width:300px}
.theme{background:var(--surface);color:var(--ink-2);border:1px solid var(--grid);border-radius:4px;min-height:30px;padding:4px 9px;font:inherit;font-size:11px;cursor:pointer}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.025em}.section-head .small{font-size:11px}
#res-plots>.plot:last-child:nth-child(odd),#ov-plots>.plot:last-child:nth-child(2){grid-column:1/-1}
#ov-plots>.plot:first-child{grid-column:1/-1;border-top:3px solid var(--accent)}
.verdicts{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 0 10px}.verdicts .label{font-size:11px;color:var(--ink-2);margin-right:6px}
.legend{gap:6px 14px;margin:10px 0 12px}.legend .item{border:0;background:none;font:inherit;font-size:12px;color:var(--ink-2);padding:3px 0;text-align:left;min-height:26px}.legend .key{flex:none}
.legend .item.off{opacity:.7}.panels{margin-top:8px}.plot .csub{font-size:12px;margin-top:5px}.explain{font-size:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--grid)}
.plot h3[role=button]::after{content:'↗';float:right;color:var(--muted);font-size:16px;margin-left:12px}.plot h3[role=button]{min-height:24px}
.empty-state{padding:26px;border:1px dashed var(--grid);color:var(--ink-2);border-radius:6px}.attention{color:var(--bad);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.rail :focus-visible{outline-color:#dce8d5}
.scroll{max-width:100%}.grid2>*,.grid3>*,.plots>*,.panels>*{min-width:0}.controls select{max-width:100%;min-height:30px}.controls label{max-width:100%}.kv{grid-template-columns:minmax(85px,130px) minmax(0,1fr)}.kv>*{overflow-wrap:anywhere}
.modal .box{border-radius:8px}.modal .x{min-width:34px;min-height:34px;font-size:24px}.modal #mbody{padding-top:12px}.seed{min-height:26px}.seed.running{animation:none}.est{color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
@media(max-width:1050px){.wrap{padding:24px 24px 40px 186px}.rail{width:162px;padding:24px 10px}h1{font-size:24px}.tile{padding:12px}.tile .v{font-size:23px}.head-actions{width:100%}}
@media(max-width:700px){.rail{position:static;width:auto;padding:10px 16px;gap:8px}.brand{font-size:14px}.brand-mark{width:23px;height:23px}.rail-caption,.rail-foot,.tab-index{display:none}.tabs{flex-direction:row;overflow-x:auto;gap:4px}.tab{padding:7px 9px;font-size:12px;flex:none}.tab .n{display:none}.wrap{padding:16px 16px 32px}.eyebrow{display:none}h1{font-size:24px}.head{gap:10px}.head-actions{width:auto}.banner{margin:12px 0;padding:10px 12px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px}.tile{padding:8px 10px}.tile .v{font-size:22px}.tile .h{margin-top:1px}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid var(--grid)}.tile:nth-child(3){padding-left:0}.plots,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.plot,.card{padding:16px}.panels{grid-template-columns:1fr!important}.modal{padding:12px}.modal .box{padding:14px}.section-head{align-items:flex-start}.section-head .small{max-width:45%;text-align:right}.strip{gap:3px}.coremap{grid-template-columns:repeat(8,1fr)}}
.viz-root.dark{color-scheme:dark;--page:#141d19;--surface:#1c2822;--surface-2:#2a3830;--ink:#eaf1e8;--ink-2:#c0cdbf;--muted:#a5b4a6;--grid:#35463b;--border:#ffffff20;--good:#8acba1;--warn:#e4b777;--bad:#f18484;--run:#80bad9;--silent:#ec90bc;--accent:#8ecab2}
</style>
</head>
<body class="viz-root">
<aside class="rail"><div class="brand"><span class="brand-mark" aria-hidden="true">e</span>exp / dashboard</div><div class="rail-caption" id="nav-caption">Research workspace</div><nav class="tabs" id="tabs" aria-label="Views"></nav><div class="rail-foot" id="rail-foot">Plan. Observe. Compare.</div></aside>
<main class="wrap">
<div class="head"><div><div class="eyebrow" id="eyebrow">Experiment / live workspace</div><h1 id="title">…</h1><div class="sub" id="subtitle"></div></div><div class="head-actions"><div class="badge" id="upd" role="status">connecting…</div><button class="theme" id="theme">◐ Theme</button></div></div>
